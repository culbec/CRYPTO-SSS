<div class="dashboard-container">
  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-header">
      <h2 class="logo">CRYPTO-SSS</h2>
      <button class="close-btn" (click)="closeSidebar()" *ngIf="!sidebarOpen()">✕</button>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li>
          <a
            routerLink="/dashboard/polls"
            [class.active]="isActive('polls')"
            (click)="closeSidebar()"
          >
            <span class="nav-icon">📋</span>
            <span class="nav-text">Polls</span>
          </a>
        </li>
        <li *ngIf="authService.hasRole('official')">
          <a
            routerLink="/dashboard/polls/create"
            [class.active]="isActive('create')"
            (click)="closeSidebar()"
          >
            <span class="nav-icon">➕</span>
            <span class="nav-text">Create Poll</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </aside>

  <!-- Overlay -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen()" (click)="closeSidebar()"></div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header -->
    <header class="dashboard-header">
      <button class="toggle-sidebar" (click)="toggleSidebar()">
        <span class="menu-icon">☰</span>
      </button>

      <div class="header-spacer"></div>

      <div class="user-info">
        <span class="user-role" [class]="'role-' + userRole">{{ userRole }}</span>
        <span class="user-name">{{ user?.username || 'User' }}</span>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
