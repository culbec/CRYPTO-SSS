  <div class="main-content">
    <header class="dashboard-header">
      <div class="brand">
        <span class="material-icons logo-icon">how_to_vote</span>
        <span class="logo-text">ShardVote</span>
      </div>

      <div class="user-section">
        <span class="welcome-text">Welcome, {{ user?.username || 'User' }}</span>
        <span class="user-role" [class]="'role-' + userRole">{{ userRole }}</span>
        <button class="logout-btn" (click)="logout()">
          <span class="material-icons">logout</span>
          <span class="logout-text">Logout</span>
        </button>
      </div>
    </header>

    <main class="page-content">

    </main>
