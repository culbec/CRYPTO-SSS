<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>CRYPTO-SSS</h1>
      <p>Secure Voting System</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          class="form-control"
          [class.is-invalid]="username?.invalid && username?.touched"
          formControlName="username"
          placeholder="Enter your username"
          [disabled]="isLoading"
        />
        <div class="invalid-feedback" *ngIf="username?.invalid && username?.touched">
          <span *ngIf="username?.errors?.['required']">Username is required</span>
          <span *ngIf="username?.errors?.['minlength']">Username must be at least 3 characters</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-group">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            [class.is-invalid]="password?.invalid && password?.touched"
            formControlName="password"
            placeholder="Enter your password"
            [disabled]="isLoading"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading"
          >
            <span *ngIf="!showPassword()">👁️</span>
            <span *ngIf="showPassword()">🙈</span>
          </button>
        </div>
        <div class="invalid-feedback" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="error" role="alert">
        <div class="alert-content">
          <span>{{ error }}</span>
          <button type="button" class="btn-close" (click)="clearError()"></button>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">
          <span class="spinner"></span>
          Signing in...
        </span>
      </button>
    </form>

    <div class="login-footer">
      <p>Don't have an account? <a routerLink="/auth/register">Sign up here</a></p>
    </div>
  </div>
</div>
